; Default export presets, copied into a game by CI when the game has none.
; To customise exports for one game, commit your own export_presets.cfg in its folder.

[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""

[preset.0.options]

; Single-threaded build: runs on itch.io and GitHub Pages without special headers.
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""

[preset.1.options]

binary_format/embed_pck=true
; Editing the .exe icon/metadata needs rcedit (Windows tooling); skip it on Linux CI.
application/modify_resources=false

[preset.2]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""

[preset.2.options]

binary_format/embed_pck=true
