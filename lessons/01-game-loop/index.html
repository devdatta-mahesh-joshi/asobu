<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lesson 01 · Dodge</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; display: grid; place-items: center; }
    canvas { background: #1b1d27; max-width: 100vw; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="450"></canvas>
  <script>
    // Open with ?debug for an on-screen dev console (Chrome on Android has no DevTools).
    if (location.search.includes('debug')) {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda@3.4.3/eruda.js';
      s.onload = () => eruda.init();
      document.head.append(s);
    }
  </script>
  <script src="game.js"></script>
</body>
</html>
